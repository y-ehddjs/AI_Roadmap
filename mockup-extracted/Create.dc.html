<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(97% 0.015 75);
      --surface: oklch(99% 0.004 75);
      --text: oklch(22% 0.02 75);
      --text-muted: oklch(52% 0.02 75);
      --border: oklch(90% 0.015 75);
      --accent: oklch(68% 0.16 55);
      --accent-contrast: oklch(99% 0.01 55);
      --accent-soft: oklch(93% 0.05 55);
    }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
    h1, h2 { font-family: "Sora", system-ui, sans-serif; margin: 0; }
    a { color: var(--accent); } a:hover { color: oklch(58% 0.16 55); }
    input, textarea { font-family: inherit; }
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: var(--bg); overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="padding: 24px 24px 8px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 36px; height: 36px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <h1 style="font-size: 20px;">새 로드맵 만들기</h1>
  </div>

  <div style="flex: 1; padding: 12px 24px 24px; display: flex; flex-direction: column; gap: 24px;">

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">만드는 방식</span>
      <div style="display: flex; gap: 8px;">
        <button style="flex: 1; min-height: 48px; border-radius: 14px; border: none; background: var(--accent); color: var(--accent-contrast); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18 9l-4.4 1.1L12 15l-1.6-4.9L6 9l4.4-1.1z"/></svg>
          AI가 만들어줘
        </button>
        <button style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          직접 만들래
        </button>
      </div>
    </div>

    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--accent-soft); border-radius: 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(45% 0.14 45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18 9l-4.4 1.1L12 15l-1.6-4.9L6 9l4.4-1.1z"/></svg>
        <span style="font-size: 12px; color: oklch(40% 0.12 45); line-height: 1.4;">AI가 마일스톤과 마감일을 자동으로 제안해요</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 13px; font-weight: 600;">목표를 알려주세요</label>
        <input type="text" placeholder="예: 3개월 안에 10km 마라톤 완주하기" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; background: var(--bg);" />
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 13px; font-weight: 600;">추가 설명 (선택)</label>
        <textarea placeholder="현재 체력 수준, 주당 가능한 시간 등을 적어주면 더 정확한 로드맵을 만들어줘요" rows="4" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; line-height: 1.5; resize: none; background: var(--bg);"></textarea>
      </div>
    </div>

  </div>

  <div style="padding: 16px 24px 28px;">
    <button style="width: 100%; min-height: 52px; background: var(--accent); color: var(--accent-contrast); border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer;">
      AI로 로드맵 만들기
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
