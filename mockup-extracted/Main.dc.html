<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(97% 0.015 75);
      --surface: oklch(99% 0.004 75);
      --text: oklch(22% 0.02 75);
      --text-muted: oklch(52% 0.02 75);
      --border: oklch(90% 0.015 75);
      --accent: oklch(68% 0.16 55);
      --accent-contrast: oklch(99% 0.01 55);
      --accent-2: oklch(66% 0.14 150);
      --danger: oklch(60% 0.18 25);
    }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
    h1, h2 { font-family: "Sora", system-ui, sans-serif; margin: 0; }
    a { color: var(--accent); } a:hover { color: oklch(58% 0.16 55); }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: var(--bg); overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column;">
  <div style="padding: 28px 24px 16px; display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1 style="font-size: 26px;">내 목표</h1>
      <div class="badge" style="background: oklch(93% 0.05 55); color: oklch(45% 0.14 45);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-1-2.5 1.5 1 2 2.5 2 4.5a5 5 0 0 1-10 0c0-5 4-6 4-11 1 1 2 2 2 3.5"/></svg>
        5일 연속
      </div>
    </div>
    <p style="margin: 0; color: var(--text-muted); font-size: 14px;">목표 3개 진행 중</p>
  </div>

  <div style="flex: 1; padding: 4px 24px 16px; display: flex; flex-direction: column; gap: 16px;">

    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
        <h2 style="font-size: 17px; line-height: 1.3;">10km 마라톤 완주하기</h2>
        <span class="badge" style="background: oklch(94% 0.03 280); color: oklch(48% 0.12 280); white-space: nowrap;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18 9l-4.4 1.1L12 15l-1.6-4.9L6 9l4.4-1.1z"/></svg>
          AI 생성
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 8px; background: var(--border); border-radius: 999px; overflow: hidden;">
          <div style="width: 42%; height: 100%; background: var(--accent); border-radius: 999px;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
          <span>42% 완료</span>
          <span>5개 중 2개</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); padding-top: 4px; border-top: 1px solid var(--border);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        다음: 5km 완주 · D-3
      </div>
    </div>

    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
        <h2 style="font-size: 17px; line-height: 1.3;">정보처리기사 자격증</h2>
        <span class="badge" style="background: oklch(94% 0.02 75); color: oklch(45% 0.02 75); white-space: nowrap;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          직접 입력
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 8px; background: var(--border); border-radius: 999px; overflow: hidden;">
          <div style="width: 68%; height: 100%; background: var(--accent); border-radius: 999px;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
          <span>68% 완료</span>
          <span>8개 중 5개</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); padding-top: 4px; border-top: 1px solid var(--border);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        다음: 실기 기출 3회 풀기 · D-1
      </div>
    </div>

    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
        <h2 style="font-size: 17px; line-height: 1.3;">매일 아침 30분 러닝 습관</h2>
        <span class="badge" style="background: oklch(94% 0.03 280); color: oklch(48% 0.12 280); white-space: nowrap;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18 9l-4.4 1.1L12 15l-1.6-4.9L6 9l4.4-1.1z"/></svg>
          AI 생성
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 8px; background: var(--border); border-radius: 999px; overflow: hidden;">
          <div style="width: 20%; height: 100%; background: var(--accent); border-radius: 999px;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
          <span>20% 완료</span>
          <span>10개 중 2개</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--danger); padding-top: 4px; border-top: 1px solid var(--border);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        다음: 주 3회 러닝 인증 · 2일 지연
      </div>
    </div>

  </div>

  <div style="padding: 16px 24px 28px; background: linear-gradient(to top, var(--bg) 60%, transparent);">
    <button style="width: 100%; min-height: 52px; background: var(--accent); color: var(--accent-contrast); border: none; border-radius: 16px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      새 로드맵 만들기
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
