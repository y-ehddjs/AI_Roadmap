<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #170b2e;
      --bg-bottom: #2b0f3d;
      --panel: #1c0f33;
      --border: #0a0414;
      --text: #f2e9ff;
      --text-dim: #9a86c2;
      --neon-pink: #ff2e8f;
      --neon-cyan: #2ee6ff;
      --neon-yellow: #ffe93f;
      --neon-purple: #b98bff;
    }
    body { margin: 0; font-family: "Space Mono", monospace; color: var(--text); }
    h1, .display { font-family: "Press Start 2P", "Space Mono", monospace; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #120821 100%);">

  <div style="padding: 24px 24px 4px;">
    <h1 style="font-size: 14px; color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,46,143,0.5);">커뮤니티</h1>
    <p style="margin: 6px 0 0; font-size: 9px; color: var(--text-dim);">공개된 로드맵을 둘러보고 하트를 보내보세요</p>
  </div>

  <div style="padding: 12px 24px 0; display: flex; gap: 8px; border-bottom: 3px solid var(--border); padding-bottom: 10px;">
    <button style="flex: 1; background: var(--panel); color: var(--text-dim); border: 3px solid var(--border); border-radius: 10px; padding: 8px 4px; font-size: 10px; font-weight: 700; box-shadow: 3px 3px 0 var(--border);">피드</button>
    <button style="flex: 1; background: var(--neon-pink); color: var(--border); border: 3px solid var(--border); border-radius: 10px; padding: 8px 4px; font-size: 10px; font-weight: 700; box-shadow: 3px 3px 0 var(--border), 0 0 12px rgba(255,46,143,0.5);">리더보드</button>
  </div>

  <div style="padding: 12px 24px 0;">
    <p style="margin: 0; font-size: 9px; color: var(--text-dim); line-height: 1.5;">내가 팔로우한 사람(과 나)의 순위 — 하트 수 · 진행률로 매겨요</p>
  </div>

  <div style="flex: 1; padding: 14px 24px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;">

    <div style="display: flex; align-items: center; gap: 12px; background: var(--panel); border: 3px solid var(--neon-yellow); border-radius: 12px; padding: 12px 14px; box-shadow: 4px 4px 0 var(--border), 0 0 18px rgba(255,233,63,0.25);">
      <span class="display" style="font-size: 16px; color: var(--neon-yellow);">1</span>
      <span style="flex: 1; font-size: 13px; font-weight: 700;">민수</span>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--neon-yellow); font-weight: 700; white-space: nowrap;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        24 · 68%
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: var(--panel); border: 3px solid var(--neon-pink); border-radius: 12px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--border), 0 0 14px rgba(255,46,143,0.2);">
      <span class="display" style="font-size: 14px; color: var(--text-dim);">2</span>
      <span style="flex: 1; font-size: 13px; font-weight: 700;">나 (동언)</span>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--neon-cyan); font-weight: 700; white-space: nowrap;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        16 · 60%
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--border);">
      <span class="display" style="font-size: 14px; color: var(--text-dim);">3</span>
      <span style="flex: 1; font-size: 13px; font-weight: 700;">지현</span>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); font-weight: 700; white-space: nowrap;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        9 · 55%
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--border); opacity: 0.7;">
      <span class="display" style="font-size: 14px; color: var(--text-dim);">4</span>
      <span style="flex: 1; font-size: 13px; font-weight: 700;">세라</span>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); font-weight: 700; white-space: nowrap;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        2 · 30%
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--border); opacity: 0.7;">
      <span class="display" style="font-size: 14px; color: var(--text-dim);">5</span>
      <span style="flex: 1; font-size: 13px; font-weight: 700;">준호</span>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); font-weight: 700; white-space: nowrap;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        0 · 20%
      </span>
    </div>

  </div>

  <div style="position: relative; height: 60px; background: var(--panel); border-top: 3px solid var(--border); display: flex; align-items: center; justify-content: space-around; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span style="font-size: 8px;">홈</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      <span style="font-size: 8px;">대시보드</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span style="font-size: 8px;">AI 코칭</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,46,143,0.6);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span style="font-size: 8px;">커뮤니티</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span style="font-size: 8px;">설정</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
