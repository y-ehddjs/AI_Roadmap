<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #170b2e;
      --bg-bottom: #2b0f3d;
      --panel: #1c0f33;
      --field: #120a24;
      --border: #0a0414;
      --text: #f2e9ff;
      --text-dim: #9a86c2;
      --neon-pink: #ff2e8f;
      --neon-cyan: #2ee6ff;
      --neon-yellow: #ffe93f;
      --neon-purple: #b98bff;
    }
    body { margin: 0; font-family: "Space Mono", monospace; color: var(--text); }
    h1, .display { font-family: "Press Start 2P", "Space Mono", monospace; }
    a { color: var(--neon-cyan); } a:hover { color: var(--neon-pink); }
    input, textarea { font-family: "Space Mono", monospace; }
    input::placeholder, textarea::placeholder { color: var(--text-dim); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #120821 100%);">

  <div style="padding: 24px 24px 8px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 36px; height: 36px; border-radius: 8px; background: var(--panel); border: 3px solid var(--border); display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 var(--border);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <h1 style="font-size: 13px; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(46,230,255,0.5);">새 로드맵</h1>
  </div>

  <div style="flex: 1; padding: 14px 24px 24px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto;">

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.5px;">만드는 방식</span>
      <div style="display: flex; gap: 8px;">
        <button style="flex: 1; min-height: 48px; border-radius: 10px; border: 3px solid var(--border); background: var(--neon-pink); color: var(--border); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 3px 3px 0 var(--border), 0 0 14px rgba(255,46,143,0.5); cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18 9l-4.4 1.1L12 15l-1.6-4.9L6 9l4.4-1.1z"/></svg>
          AI가 만들어줘
        </button>
        <button style="flex: 1; min-height: 48px; border-radius: 10px; border: 3px solid var(--border); background: var(--panel); color: var(--text-dim); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          직접 만들래
        </button>
      </div>
    </div>

    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 5px 5px 0 var(--border), 0 0 20px rgba(46,230,255,0.1); display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: rgba(185,139,255,0.12); border: 2px solid var(--neon-purple); border-radius: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--neon-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18 9l-4.4 1.1L12 15l-1.6-4.9L6 9l4.4-1.1z"/></svg>
        <span style="font-size: 10px; color: var(--neon-purple); line-height: 1.5;">AI가 마일스톤과 마감일을 자동으로 제안해요</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 10px; font-weight: 700; color: var(--text-dim);">목표를 알려주세요</label>
        <input type="text" placeholder="예: 3개월 안에 10km 마라톤 완주하기" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--field); color: var(--text);" />
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 10px; font-weight: 700; color: var(--text-dim);">추가 설명 (선택)</label>
        <textarea placeholder="현재 체력 수준, 주당 가능한 시간 등을 적어주면 더 정확한 로드맵을 만들어줘요" rows="4" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 11px; line-height: 1.6; resize: none; background: var(--field); color: var(--text);"></textarea>
      </div>
    </div>

  </div>

  <div style="padding: 16px 24px 28px;">
    <button style="width: 100%; min-height: 52px; background: var(--neon-pink); color: var(--border); border: 3px solid var(--border); border-radius: 14px; font-family: 'Press Start 2P', monospace; font-size: 11px; box-shadow: 4px 4px 0 var(--border), 0 0 20px rgba(255,46,143,0.5); cursor: pointer;">
      AI로 만들기
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
