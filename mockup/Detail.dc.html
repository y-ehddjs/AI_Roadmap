<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #170b2e;
      --bg-bottom: #2b0f3d;
      --panel: #1c0f33;
      --border: #0a0414;
      --text: #f2e9ff;
      --text-dim: #9a86c2;
      --neon-pink: #ff2e8f;
      --neon-cyan: #2ee6ff;
      --neon-yellow: #ffe93f;
      --neon-purple: #b98bff;
      --neon-red: #ff3b3b;
    }
    body { margin: 0; font-family: "Space Mono", monospace; color: var(--text); }
    h1, .display { font-family: "Press Start 2P", "Space Mono", monospace; }
    a { color: var(--neon-cyan); } a:hover { color: var(--neon-pink); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #120821 100%);">

  <div style="position: relative; padding: 24px 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="width: 36px; height: 36px; border-radius: 8px; background: var(--panel); border: 3px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 3px 3px 0 var(--border);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <h1 style="font-size: 10px; text-align: center; line-height: 1.6; color: var(--text);">10KM 마라톤 완주하기</h1>
      <span style="font-size: 9px; font-weight: 700; color: var(--neon-purple);">AI 생성</span>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 8px; background: var(--panel); border: 3px solid var(--neon-red); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 3px 3px 0 var(--border);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--neon-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </div>
  </div>

  <div style="position: relative; padding: 12px 24px 0;">
    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--border); display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 11px; font-weight: 700; color: var(--neon-cyan);">커뮤니티에 게시물로 등록됨</span>
        <span style="font-size: 9px; color: var(--text-dim); text-decoration: underline; cursor: pointer;">등록 취소</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <input readonly value="roadmap.app/r/8f2a1c" style="flex: 1; min-width: 0; background: #0e0a1c; border: 2px solid var(--border); border-radius: 6px; color: var(--text-dim); font-size: 9px; padding: 6px 8px; font-family: 'Space Mono', monospace;" />
        <button style="background: var(--neon-cyan); color: var(--border); border: 2px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 9px; font-weight: 700; box-shadow: 2px 2px 0 var(--border); white-space: nowrap;">복사</button>
      </div>
    </div>
  </div>

  <div style="position: relative; padding: 16px 24px 8px;">
    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: 4px 4px 0 var(--border), 0 0 18px rgba(46,230,255,0.12); display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim);">
        <span>전체 진행률</span>
        <span style="font-weight: 700; color: var(--neon-cyan);">42%</span>
      </div>
      <div style="height: 10px; background: #0e0a1c; border: 2px solid var(--border); border-radius: 999px; overflow: hidden;">
        <div style="width: 42%; height: 100%; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan);"></div>
      </div>
      <span style="font-size: 9px; color: var(--text-dim);">5개 마일스톤 중 2개 완료</span>
    </div>
  </div>

  <div style="position: relative; padding: 8px 24px 0;">
    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--border);">
      <p style="margin: 0 0 8px; font-size: 9px; font-weight: 700; color: var(--text-dim);">+ 마일스톤 추가</p>
      <div style="display: flex; gap: 6px;">
        <input placeholder="제목" style="flex: 1; min-width: 0; background: #0e0a1c; border: 2px solid var(--border); border-radius: 6px; color: var(--text); font-size: 10px; padding: 6px 8px; font-family: 'Space Mono', monospace;" />
        <input type="date" style="width: 100px; background: #0e0a1c; border: 2px solid var(--border); border-radius: 6px; color: var(--text); font-size: 10px; padding: 6px 4px; font-family: 'Space Mono', monospace;" />
        <button style="background: var(--neon-cyan); color: var(--border); border: 2px solid var(--border); border-radius: 6px; padding: 0 10px; font-size: 9px; font-weight: 700; box-shadow: 2px 2px 0 var(--border);">추가</button>
      </div>
    </div>
  </div>

  <div style="position: relative; flex: 1; padding: 20px 24px 40px; overflow-y: auto;">
    <svg width="342" height="700" viewBox="0 0 342 700" style="position: absolute; left: 24px; top: 24px; z-index: 0;">
      <path d="M60,40 C60,115 280,115 280,190 C280,265 60,265 60,340 C60,415 280,415 280,490 C280,565 60,565 60,640"
        fill="none" style="stroke: var(--neon-pink); opacity: 0.4;" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/>
    </svg>

    <div style="position: absolute; left: 60px; top: 40px; transform: translate(-50%, -50%); z-index: 1; width: 52px; height: 52px; border-radius: 10px; background: var(--panel); border: 3px solid var(--neon-cyan); box-shadow: 3px 3px 0 var(--border), 0 0 14px rgba(46,230,255,0.6); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>
    </div>
    <div style="position: absolute; left: 100px; top: 40px; transform: translateY(-50%); width: 190px;">
      <div style="font-size: 11px; font-weight: 700;">1km 완주</div>
      <div style="font-size: 9px; color: var(--text-dim);">완료 · 2/10</div>
    </div>

    <div style="position: absolute; left: 280px; top: 190px; transform: translate(-50%, -50%); z-index: 1; width: 52px; height: 52px; border-radius: 10px; background: var(--panel); border: 3px solid var(--neon-cyan); box-shadow: 3px 3px 0 var(--border), 0 0 14px rgba(46,230,255,0.6); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>
    </div>
    <div style="position: absolute; left: 40px; top: 190px; transform: translateY(-50%); width: 190px; text-align: right;">
      <div style="font-size: 11px; font-weight: 700;">3km 완주</div>
      <div style="font-size: 9px; color: var(--text-dim);">완료 · 2/24</div>
    </div>

    <div style="position: absolute; left: 60px; top: 340px; transform: translate(-50%, -50%); z-index: 1; width: 62px; height: 62px; border-radius: 10px; background: var(--neon-pink); border: 3px solid var(--border); box-shadow: 4px 4px 0 var(--border), 0 0 20px rgba(255,46,143,0.7); display: flex; align-items: center; justify-content: center;">
      <span class="display" style="font-size: 15px; color: var(--border);">03</span>
    </div>
    <div style="position: absolute; left: 104px; top: 340px; transform: translateY(-50%); width: 190px;">
      <div style="font-size: 12px; font-weight: 700; color: var(--neon-pink);">5km 완주</div>
      <div style="font-size: 9px; color: var(--neon-yellow);">마감 3/15 · D-3</div>
    </div>

    <div style="position: absolute; left: 280px; top: 490px; transform: translate(-50%, -50%); z-index: 1; width: 52px; height: 52px; border-radius: 10px; background: var(--panel); border: 3px solid var(--text-dim); display: flex; align-items: center; justify-content: center;">
      <span class="display" style="font-size: 13px; color: var(--text-dim);">04</span>
    </div>
    <div style="position: absolute; left: 40px; top: 490px; transform: translateY(-50%); width: 190px; text-align: right;">
      <div style="font-size: 11px; font-weight: 700; color: var(--text-dim);">7km 완주</div>
      <div style="font-size: 9px; color: var(--text-dim);">마감 3/29</div>
    </div>

    <div style="position: absolute; left: 60px; top: 640px; transform: translate(-50%, -50%); z-index: 1; width: 52px; height: 52px; border-radius: 10px; background: var(--panel); border: 3px solid var(--text-dim); display: flex; align-items: center; justify-content: center;">
      <span class="display" style="font-size: 13px; color: var(--text-dim);">05</span>
    </div>
    <div style="position: absolute; left: 100px; top: 640px; transform: translateY(-50%); width: 190px;">
      <div style="font-size: 11px; font-weight: 700; color: var(--text-dim);">10km 완주</div>
      <div style="font-size: 9px; color: var(--text-dim);">마감 4/12</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
