<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2d1b4e;
      --paper: #fff6e0;
      --ink: #1a0f2e;
      --accent-yellow: #ffd23f;
      --accent-pink: #ff5d8f;
      --accent-teal: #21c5b7;
      --accent-blue: #3a7bd5;
    }
    body { margin: 0; font-family: "Space Grotesk", system-ui, sans-serif; color: var(--ink); }
    h1, h2, .display { font-family: "Bungee", "Space Grotesk", system-ui, sans-serif; }
    a { color: var(--accent-blue); } a:hover { color: var(--accent-pink); }
  </style>
</helmet>
<div style="width: 320px; min-height: 600px; background: var(--bg); background-image: radial-gradient(circle, rgba(255,255,255,0.06) 2px, transparent 2px); background-size: 18px 18px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <span class="display" style="color: var(--paper); font-size: 15px; letter-spacing: 0.5px;">퀘스트 로그</span>
    <div style="background: var(--accent-yellow); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: 11px; box-shadow: 3px 3px 0 var(--ink);">
      5일 연속
    </div>
  </div>

  <div style="background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 16px; box-shadow: 5px 5px 0 var(--ink); display: flex; flex-direction: column; gap: 10px;">
    <div class="display" style="font-size: 13px; line-height: 1.4;">10KM 마라톤<br>완주하기</div>
    <div style="height: 14px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden;">
      <div style="width: 42%; height: 100%; background: var(--accent-teal);"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700;">
      <span>LV.2 · 42%</span>
      <span style="color: var(--accent-pink);">D-3</span>
    </div>
  </div>

  <div style="position: relative; height: 220px; margin-top: 4px;">
    <svg width="280" height="220" viewBox="0 0 280 220" style="position: absolute; left: 0; top: 0;">
      <path d="M40,30 C40,90 240,90 240,150" fill="none" style="stroke: var(--paper);" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
    </svg>
    <div style="position: absolute; left: 40px; top: 30px; transform: translate(-50%,-50%); width: 52px; height: 52px; border-radius: 10px; background: var(--accent-teal); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>
    </div>
    <div style="position: absolute; left: 240px; top: 150px; transform: translate(-50%,-50%); width: 60px; height: 60px; border-radius: 10px; background: var(--accent-yellow); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); display: flex; align-items: center; justify-content: center;">
      <span class="display" style="font-size: 18px;">3</span>
    </div>
    <div style="position: absolute; left: 200px; top: 178px; color: var(--paper); font-size: 11px; font-weight: 700;">5KM 완주</div>
  </div>

  <button style="width: 100%; min-height: 48px; background: var(--accent-pink); color: var(--paper); border: 3px solid var(--ink); border-radius: 12px; font-family: 'Bungee', sans-serif; font-size: 12px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer;">
    + 새 퀘스트 시작
  </button>
</div>
</x-dc>
</body>
</html>
