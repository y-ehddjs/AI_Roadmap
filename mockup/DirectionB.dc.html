<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #10151f;
      --line: #1e2a3a;
      --text: #d7e6ff;
      --text-dim: #5c7599;
      --neon-green: #39ff9e;
      --neon-purple: #b98bff;
      --neon-pink: #ff5ec4;
    }
    body { margin: 0; font-family: "Space Mono", monospace; color: var(--text); }
    h1, h2, .display { font-family: "Chakra Petch", "Space Mono", monospace; }
    a { color: var(--neon-green); } a:hover { color: var(--neon-purple); }
  </style>
</helmet>
<div style="width: 320px; min-height: 600px; background: var(--bg); box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; opacity: 0.4;"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
    <span class="display" style="font-size: 14px; letter-spacing: 1px; text-transform: uppercase;">// ROADMAP.LOG</span>
    <div style="border: 1px solid var(--neon-green); border-radius: 4px; padding: 4px 8px; font-size: 10px; color: var(--neon-green); box-shadow: 0 0 8px rgba(57,255,158,0.5);">
      STREAK:05
    </div>
  </div>

  <div style="position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 0 1px rgba(185,139,255,0.1), 0 0 24px rgba(185,139,255,0.08);">
    <div class="display" style="font-size: 13px; color: var(--text);">10KM_MARATHON.exe</div>
    <div style="height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;">
      <div style="width: 42%; height: 100%; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green);"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim);">
      <span>PROGRESS 42%</span>
      <span style="color: var(--neon-pink);">DEADLINE T-3d</span>
    </div>
  </div>

  <div style="position: relative; height: 200px; margin-top: 4px;">
    <svg width="280" height="200" viewBox="0 0 280 200" style="position: absolute; left: 0; top: 0;">
      <path d="M40,20 L40,90 L240,90 L240,150" fill="none" style="stroke: var(--neon-purple); opacity: 0.5;" stroke-width="2" stroke-dasharray="4 6"/>
    </svg>
    <div style="position: absolute; left: 40px; top: 20px; transform: translate(-50%,-50%); width: 44px; height: 44px; border-radius: 6px; background: var(--panel); border: 1px solid var(--neon-green); box-shadow: 0 0 12px rgba(57,255,158,0.6); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--neon-green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>
    </div>
    <div style="position: absolute; left: 240px; top: 150px; transform: translate(-50%,-50%); width: 48px; height: 48px; border-radius: 6px; background: var(--panel); border: 1px solid var(--neon-purple); box-shadow: 0 0 14px rgba(185,139,255,0.6); display: flex; align-items: center; justify-content: center;">
      <span class="display" style="font-size: 15px; color: var(--neon-purple);">03</span>
    </div>
    <div style="position: absolute; left: 200px; top: 178px; font-size: 10px; color: var(--text-dim);">NODE_03 · 5KM</div>
  </div>

  <button style="position: relative; width: 100%; min-height: 48px; background: transparent; color: var(--neon-green); border: 1px solid var(--neon-green); border-radius: 6px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; box-shadow: 0 0 12px rgba(57,255,158,0.3); cursor: pointer;">
    + NEW_ROADMAP
  </button>
</div>
</x-dc>
</body>
</html>
