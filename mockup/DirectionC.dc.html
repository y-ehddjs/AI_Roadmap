<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Libre+Franklin:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f1e7;
      --ink: #201c16;
      --ink-soft: #675f52;
      --rule: #d8d0bf;
      --accent: #7a3b2e;
    }
    body { margin: 0; font-family: "Libre Franklin", system-ui, sans-serif; color: var(--ink); }
    h1, h2, .display { font-family: "Newsreader", Georgia, serif; }
    a { color: var(--accent); } a:hover { color: var(--ink); }
  </style>
</helmet>
<div style="width: 320px; min-height: 600px; background: var(--paper); box-sizing: border-box; padding: 32px 24px; display: flex; flex-direction: column; gap: 22px;">
  <div>
    <span style="font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft);">Roadmap No. 01</span>
    <div class="display" style="font-size: 28px; font-style: italic; line-height: 1.15; margin-top: 6px;">10km 마라톤을<br>완주하는 길</div>
  </div>

  <div style="border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 14px 0; display: flex; justify-content: space-between; align-items: baseline;">
    <span class="display" style="font-size: 22px;">42%</span>
    <span style="font-size: 11px; color: var(--ink-soft);">5개 중 2개 완료 · 마감 D-3</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 0;">
    <div style="display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule);">
      <span class="display" style="font-size: 14px; color: var(--ink-soft); width: 20px;">01</span>
      <div style="flex: 1;">
        <div style="font-size: 13px; font-weight: 600;">1km 완주</div>
        <div style="font-size: 11px; color: var(--ink-soft);">완료 · 2월 10일</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>
    </div>
    <div style="display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule);">
      <span class="display" style="font-size: 14px; color: var(--accent); width: 20px;">02</span>
      <div style="flex: 1;">
        <div style="font-size: 13px; font-weight: 600;">5km 완주</div>
        <div style="font-size: 11px; color: var(--accent);">진행 중 · 마감 3월 15일</div>
      </div>
    </div>
    <div style="display: flex; gap: 14px; padding: 12px 0;">
      <span class="display" style="font-size: 14px; color: var(--ink-soft); opacity: 0.5; width: 20px;">03</span>
      <div style="flex: 1; opacity: 0.5;">
        <div style="font-size: 13px; font-weight: 600;">10km 완주</div>
        <div style="font-size: 11px; color: var(--ink-soft);">예정 · 4월 12일</div>
      </div>
    </div>
  </div>

  <button style="width: 100%; min-height: 46px; background: var(--ink); color: var(--paper); border: none; font-family: 'Libre Franklin', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1px; cursor: pointer;">
    새 로드맵 시작하기
  </button>
</div>
</x-dc>
</body>
</html>
