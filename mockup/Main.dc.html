<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #170b2e;
      --bg-bottom: #2b0f3d;
      --panel: #1c0f33;
      --border: #0a0414;
      --text: #f2e9ff;
      --text-dim: #9a86c2;
      --neon-pink: #ff2e8f;
      --neon-cyan: #2ee6ff;
      --neon-yellow: #ffe93f;
      --neon-red: #ff3b3b;
      --neon-purple: #b98bff;
    }
    body { margin: 0; font-family: "Space Mono", monospace; color: var(--text); }
    h1, h2, .display { font-family: "Press Start 2P", "Space Mono", monospace; }
    a { color: var(--neon-cyan); } a:hover { color: var(--neon-pink); }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 700; padding: 4px 8px; border-radius: 6px; border: 2px solid var(--border); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #120821 100%);">

  <!-- synthwave grid horizon -->
  <svg width="390" height="180" viewBox="0 0 390 180" style="position: absolute; left: 0; bottom: 0; opacity: 0.3; pointer-events: none;">
    <line x1="0" y1="20" x2="390" y2="20" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="0" y1="55" x2="390" y2="55" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="0" y1="100" x2="390" y2="100" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="0" y1="150" x2="390" y2="150" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="20" y2="180" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="110" y2="180" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="195" y2="180" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="280" y2="180" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="370" y2="180" stroke="#ff2e8f" stroke-width="1"/>
  </svg>

  <div style="position: relative; padding: 28px 24px 12px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1 class="display" style="font-size: 15px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(46,230,255,0.6);">내 목표</h1>
      <div class="badge" style="background: var(--neon-yellow); color: var(--border); box-shadow: 3px 3px 0 var(--border), 0 0 14px rgba(255,233,63,0.5);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-1-2.5 1.5 1 2 2.5 2 4.5a5 5 0 0 1-10 0c0-5 4-6 4-11 1 1 2 2 2 3.5"/></svg>
        5일 연속
      </div>
    </div>
    <p style="margin: 0; color: var(--text-dim); font-size: 11px;">목표 3개 진행 중</p>
  </div>

  <div style="position: relative; flex: 1; padding: 4px 24px 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">

    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 5px 5px 0 var(--border), 0 0 20px rgba(46,230,255,0.1); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
        <h2 style="font-size: 13px; font-weight: 700; line-height: 1.4; font-family: 'Space Mono', monospace;">10km 마라톤 완주하기</h2>
        <span class="badge" style="background: var(--neon-purple); color: var(--border); white-space: nowrap;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18 9l-4.4 1.1L12 15l-1.6-4.9L6 9l4.4-1.1z"/></svg>
          AI
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 10px; background: #0e0a1c; border: 2px solid var(--border); border-radius: 999px; overflow: hidden;">
          <div style="width: 42%; height: 100%; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan);"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim);">
          <span>42% 완료</span>
          <span>5개 중 2개</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--neon-yellow); padding-top: 8px; border-top: 2px dashed var(--border);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        다음: 5km 완주 · D-3
      </div>
    </div>

    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 5px 5px 0 var(--border), 0 0 20px rgba(46,230,255,0.1); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
        <h2 style="font-size: 13px; font-weight: 700; line-height: 1.4; font-family: 'Space Mono', monospace;">정보처리기사 자격증</h2>
        <span class="badge" style="background: var(--panel); color: var(--text-dim); white-space: nowrap;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          직접입력
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 10px; background: #0e0a1c; border: 2px solid var(--border); border-radius: 999px; overflow: hidden;">
          <div style="width: 68%; height: 100%; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan);"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim);">
          <span>68% 완료</span>
          <span>8개 중 5개</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--neon-yellow); padding-top: 8px; border-top: 2px dashed var(--border);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        다음: 실기 기출 3회 풀기 · D-1
      </div>
    </div>

    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 5px 5px 0 var(--border), 0 0 20px rgba(255,59,59,0.12); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
        <h2 style="font-size: 13px; font-weight: 700; line-height: 1.4; font-family: 'Space Mono', monospace;">매일 아침 30분 러닝 습관</h2>
        <span class="badge" style="background: var(--neon-purple); color: var(--border); white-space: nowrap;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.9L18 9l-4.4 1.1L12 15l-1.6-4.9L6 9l4.4-1.1z"/></svg>
          AI
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 10px; background: #0e0a1c; border: 2px solid var(--border); border-radius: 999px; overflow: hidden;">
          <div style="width: 20%; height: 100%; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan);"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim);">
          <span>20% 완료</span>
          <span>10개 중 2개</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--neon-red); padding-top: 8px; border-top: 2px dashed var(--border); text-shadow: 0 0 6px rgba(255,59,59,0.6);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        다음: 주 3회 러닝 인증 · 2일 지연
      </div>
    </div>

  </div>

  <div style="position: relative; padding: 14px 24px 16px;">
    <button style="width: 100%; min-height: 48px; background: var(--neon-pink); color: var(--border); border: 3px solid var(--border); border-radius: 14px; font-family: 'Press Start 2P', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 4px 4px 0 var(--border), 0 0 20px rgba(255,46,143,0.5); cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      새 로드맵
    </button>
  </div>

  <div style="position: relative; height: 60px; background: var(--panel); border-top: 3px solid var(--border); display: flex; align-items: center; justify-content: space-around; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(46,230,255,0.6);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span style="font-size: 8px;">홈</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      <span style="font-size: 8px;">대시보드</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span style="font-size: 8px;">AI 코칭</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3a2 2 0 0 1-2 4"/><path d="M7 5H4a2 2 0 0 0 2 4"/></svg>
      <span style="font-size: 8px;">리더보드</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span style="font-size: 8px;">커뮤니티</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span style="font-size: 8px;">설정</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
