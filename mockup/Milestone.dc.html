<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #170b2e;
      --bg-bottom: #2b0f3d;
      --panel: #1c0f33;
      --field: #120a24;
      --border: #0a0414;
      --text: #f2e9ff;
      --text-dim: #9a86c2;
      --neon-pink: #ff2e8f;
      --neon-cyan: #2ee6ff;
      --neon-red: #ff3b3b;
    }
    body { margin: 0; font-family: "Space Mono", monospace; color: var(--text); }
    h1, .display { font-family: "Press Start 2P", "Space Mono", monospace; }
    input::placeholder, textarea::placeholder { color: var(--text-dim); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #120821 100%);">

  <div style="padding: 24px 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="width: 36px; height: 36px; border-radius: 8px; background: var(--panel); border: 3px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 3px 3px 0 var(--border);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 8px; background: var(--panel); border: 3px solid var(--neon-red); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 3px 3px 0 var(--border);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--neon-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </div>
  </div>

  <div style="flex: 1; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto;">
    <h1 style="font-size: 15px; line-height: 1.5; color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,46,143,0.5);">5km 완주</h1>

    <label style="display: flex; align-items: center; gap: 10px; background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: 3px 3px 0 var(--border); cursor: pointer;">
      <span style="width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--neon-cyan); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"></span>
      <span style="font-size: 12px; font-weight: 700;">완료로 표시하기</span>
    </label>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 9px; font-weight: 700; color: var(--text-dim);">메모</span>
      <textarea rows="4" placeholder="이 마일스톤에 대한 메모를 남겨보세요" style="width: 100%; box-sizing: border-box; background: var(--field); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; padding: 10px 12px; font-family: 'Space Mono', monospace; line-height: 1.6; resize: none;">주말에 한강공원에서 뛰기로 함. 페이스 6분/km 목표.</textarea>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 9px; font-weight: 700; color: var(--text-dim);">마감일</span>
      <input type="date" value="2026-03-15" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; background: var(--field); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-family: 'Space Mono', monospace;" />
      <span style="font-size: 9px; color: var(--neon-yellow, #ffe93f);">D-3 남음</span>
    </div>
  </div>

  <div style="padding: 16px 24px 28px;">
    <button style="width: 100%; min-height: 48px; background: var(--neon-cyan); color: var(--border); border: 3px solid var(--border); border-radius: 14px; font-family: 'Press Start 2P', monospace; font-size: 11px; box-shadow: 4px 4px 0 var(--border), 0 0 18px rgba(46,230,255,0.5); cursor: pointer;">
      저장
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
