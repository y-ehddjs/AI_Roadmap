<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #170b2e;
      --bg-bottom: #2b0f3d;
      --panel: #1c0f33;
      --field: #120a24;
      --border: #0a0414;
      --text: #f2e9ff;
      --text-dim: #9a86c2;
      --neon-pink: #ff2e8f;
      --neon-cyan: #2ee6ff;
      --neon-red: #ff3b3b;
    }
    body { margin: 0; font-family: "Space Mono", monospace; color: var(--text); }
    h1, .display { font-family: "Press Start 2P", "Space Mono", monospace; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #120821 100%);">

  <div style="padding: 24px 24px 12px;">
    <h1 style="font-size: 14px; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(46,230,255,0.5);">설정</h1>
  </div>

  <div style="flex: 1; padding: 8px 24px 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">

    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 4px 4px 0 var(--border); display: flex; flex-direction: column; gap: 16px;">
      <p style="margin: 0; font-size: 9px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.5px;">알림</p>

      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <span style="font-size: 12px;">알림 받기</span>
        <span style="width: 42px; height: 24px; border-radius: 999px; background: var(--neon-cyan); border: 2px solid var(--border); position: relative; display: inline-block; box-shadow: 0 0 10px rgba(46,230,255,0.5);">
          <span style="position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 999px; background: var(--border);"></span>
        </span>
      </label>

      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px;">알림 시간</span>
        <input type="time" value="09:00" style="background: var(--field); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; padding: 8px 10px; font-family: 'Space Mono', monospace;" />
      </div>
      <p style="margin: 0; font-size: 9px; color: var(--text-dim); line-height: 1.6;">마감일 임박·체크인 유도 알림을 이 시간에 확인해서 보내요</p>
    </div>

    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 4px 4px 0 var(--border); display: flex; flex-direction: column; gap: 14px;">
      <p style="margin: 0; font-size: 9px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.5px;">프로필</p>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 9px; color: var(--text-dim);">닉네임 (리더보드·공개 화면에 표시)</label>
        <input value="yoondongeon" style="width: 100%; box-sizing: border-box; min-height: 40px; padding: 0 10px; background: var(--field); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-family: 'Space Mono', monospace;" />
      </div>

      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <span style="font-size: 12px;">리더보드에 표시</span>
        <span style="width: 42px; height: 24px; border-radius: 999px; background: var(--border); border: 2px solid var(--border); position: relative; display: inline-block;">
          <span style="position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 999px; background: var(--text-dim);"></span>
        </span>
      </label>
    </div>

    <div style="background: var(--panel); border: 3px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 4px 4px 0 var(--border); display: flex; flex-direction: column; gap: 10px;">
      <p style="margin: 0; font-size: 9px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.5px;">계정</p>
      <span style="font-size: 11px; color: var(--text-dim);">user@example.com</span>
      <button style="width: 100%; min-height: 44px; margin-top: 6px; background: transparent; color: var(--neon-red); border: 3px solid var(--neon-red); border-radius: 12px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; box-shadow: 3px 3px 0 var(--border); cursor: pointer;">
        로그아웃
      </button>
    </div>

  </div>

  <div style="height: 60px; background: var(--panel); border-top: 3px solid var(--border); display: flex; align-items: center; justify-content: space-around; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span style="font-size: 8px;">홈</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      <span style="font-size: 8px;">대시보드</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span style="font-size: 8px;">AI 코칭</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3a2 2 0 0 1-2 4"/><path d="M7 5H4a2 2 0 0 0 2 4"/></svg>
      <span style="font-size: 8px;">리더보드</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span style="font-size: 8px;">커뮤니티</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(46,230,255,0.6);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span style="font-size: 8px;">설정</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
