<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #170b2e;
      --bg-bottom: #2b0f3d;
      --panel: #1c0f33;
      --field: #120a24;
      --border: #0a0414;
      --text: #f2e9ff;
      --text-dim: #9a86c2;
      --neon-pink: #ff2e8f;
      --neon-cyan: #2ee6ff;
    }
    body { margin: 0; font-family: "Space Mono", monospace; color: var(--text); }
    h1, .display { font-family: "Press Start 2P", "Space Mono", monospace; }
    a { color: var(--neon-cyan); }
    input::placeholder { color: var(--text-dim); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #120821 100%); padding: 24px;">

  <svg width="390" height="220" viewBox="0 0 390 220" style="position: absolute; left: 0; bottom: 0; opacity: 0.3; pointer-events: none;">
    <line x1="195" y1="0" x2="20" y2="220" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="110" y2="220" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="195" y2="220" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="280" y2="220" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="195" y1="0" x2="370" y2="220" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="0" y1="40" x2="390" y2="40" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="0" y1="90" x2="390" y2="90" stroke="#ff2e8f" stroke-width="1"/>
    <line x1="0" y1="150" x2="390" y2="150" stroke="#ff2e8f" stroke-width="1"/>
  </svg>

  <div style="position: relative; width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 28px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="width: 64px; height: 64px; border-radius: 16px; background: var(--panel); border: 3px solid var(--border); box-shadow: 4px 4px 0 var(--border), 0 0 20px rgba(46,230,255,0.4); display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <h1 class="display" style="font-size: 15px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(46,230,255,0.6); text-align: center; line-height: 1.6;">ROADMAP<br>QUEST</h1>
    </div>

    <div style="width: 100%; background: var(--panel); border: 3px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: 5px 5px 0 var(--border), 0 0 24px rgba(255,46,143,0.12); display: flex; flex-direction: column; gap: 14px;">
      <p style="margin: 0 0 -2px; font-size: 12px; font-weight: 700; color: var(--text);">회원가입</p>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 9px; font-weight: 700; color: var(--text-dim);">이메일</label>
        <input type="email" placeholder="you@example.com" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; background: var(--field); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-family: 'Space Mono', monospace;" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 9px; font-weight: 700; color: var(--text-dim);">비밀번호 (8자 이상)</label>
        <input type="password" placeholder="8자 이상" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; background: var(--field); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-family: 'Space Mono', monospace;" />
      </div>
      <p style="margin: 0; font-size: 10px; color: var(--neon-pink);">이메일 또는 비밀번호 형식을 확인해주세요 (비밀번호 8자 이상)</p>
      <button style="width: 100%; min-height: 48px; margin-top: 4px; background: var(--neon-pink); color: var(--border); border: 3px solid var(--border); border-radius: 12px; font-family: 'Press Start 2P', monospace; font-size: 11px; box-shadow: 4px 4px 0 var(--border), 0 0 18px rgba(255,46,143,0.5); cursor: pointer;">
        가입하기
      </button>
    </div>

    <a href="#" style="font-size: 11px; text-decoration: underline;">이미 계정이 있으신가요? 로그인</a>
  </div>
</div>
</x-dc>
</body>
</html>
